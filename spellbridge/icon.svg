<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 秘法雙橋 app icon: a little shadow wizard in a pointed hat; its two arched feet are the two bridges -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#d9c8ff"/><stop offset=".55" stop-color="#a77bff"/><stop offset="1" stop-color="#7a45f0"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="body" cx=".32" cy=".28" r=".85"><stop offset="0" stop-color="#3a2d5e"/><stop offset=".45" stop-color="#151026"/><stop offset="1" stop-color="#050309"/></radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c69bff"/><stop offset="1" stop-color="#5b23c9"/></linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a52f0"/><stop offset="1" stop-color="#4a1aa8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="sq"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <ellipse cx="262" cy="452" rx="150" ry="22" fill="#3b1490" opacity=".35" filter="url(#sh)"/>
    <!-- body with two arched feet -->
    <path fill="url(#body)" d="M130 446C112 360 124 268 188 236c40-20 112-20 152 0 64 32 74 124 54 210h-58q-6-62-48-62t-48 62h-24q-6-62-48-62t-48 62z"/>
    <path fill="#fff" opacity=".1" d="M150 330c4-52 26-78 62-90-30 22-46 52-50 96z"/>
    <!-- eyes -->
    <ellipse cx="218" cy="318" rx="26" ry="38" fill="#fff"/>
    <ellipse cx="304" cy="318" rx="26" ry="38" fill="#fff"/>
    <ellipse cx="224" cy="328" rx="12" ry="17" fill="#120c22"/>
    <ellipse cx="310" cy="328" rx="12" ry="17" fill="#120c22"/>
    <circle cx="229" cy="320" r="5" fill="#fff"/><circle cx="315" cy="320" r="5" fill="#fff"/>
    <!-- hat -->
    <path fill="url(#hat)" d="M176 236C214 170 250 110 286 70c16-18 44-14 56 16-18-6-34 2-36 20 2 44 12 88 26 130z"/>
    <path fill="#fff" opacity=".22" d="M210 222c20-52 40-100 62-140-8 46-20 92-36 140z"/>
    <path fill="#f3c55b" d="M184 214h136l8 26H176z"/>
    <path fill="url(#brim)" d="M120 246c40-22 232-22 272 0 10 8-2 16-14 16-60-10-184-10-244 0-12 0-24-8-14-16z"/>
    <path fill="#ffe680" d="M252 160l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>
    <!-- sparkles -->
    <path fill="#fff" d="M410 86l9 23 23 9-23 9-9 23-9-23-23-9 23-9z"/>
    <path fill="#fff" opacity=".85" d="M98 150l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
