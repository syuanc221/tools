<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>秘法雙橋 後台</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#111a26;--panel:#1a2536;--line:#2a3850;--ink:#f4efe6;--muted:#8f9ab3;--gold:#f3c55b;--bar:#b65cf0;--ok:#2fb37a;--red:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px 'Noto Sans TC',system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:18px}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.06em}
header h1 small{color:var(--muted);font-size:13px;font-weight:700;margin-left:8px}
header .sp{flex:1}
header a{color:var(--muted);font-size:13px;font-weight:700}
.seg{display:flex;gap:4px}.seg button{border:0;background:var(--panel);color:var(--ink);padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);padding:12px 14px}
.tile b{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{color:var(--muted);font-size:12px;font-weight:700}
.tile small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--panel);padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;font-weight:900}
.card h2 small{color:var(--muted);font-size:12px;font-weight:700;margin-left:6px}
.chart{position:relative;height:150px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:#0b111a;border:1px solid var(--line);padding:4px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.rep{border-bottom:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.rep:last-child{border-bottom:0}
.rep .k{display:inline-block;font-size:11px;font-weight:900;padding:1px 6px;margin-right:6px;background:var(--line)}
.rep .k.bug{background:var(--red)}.rep .k.idea{background:#2c5fb8}
.rep p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.rep .meta{grid-column:1/-1;color:var(--muted);font-size:11px;word-break:break-all}
.rep button{border:0;background:var(--line);color:var(--ink);padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;align-self:start}
.rep.done{opacity:.5}
.gate{background:var(--panel);padding:28px;text-align:center;max-width:460px;margin:60px auto}
.gate a,.gate button{display:inline-block;margin-top:14px;background:var(--gold);color:#2a1700;padding:10px 18px;font-weight:900;text-decoration:none;border:0;font:inherit;cursor:pointer}
@media (max-width:520px){.tile b{font-size:22px}}
</style></head>
<body><main id="app"><p class="muted">讀取中…</p></main>
<script>
const SB_URL='https://kenzsxyyqhfijbkeqnjz.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlbnpzeHl5cWhmaWpia2Vxbmp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDQ2OTUsImV4cCI6MjEwODIyMDY5NX0.PZZgqGtDdlSynKVLhnHj2ak40v2JV6uE_4cFxfMY3c0';
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SCREEN={home:'首頁',cards:'卡牌',gacha:'抽卡',guild:'公會',profile:'個人'};
const MODE={story:'冒險',ladder:'天梯',friend:'好友對戰','?':'其他'};
const KIND={bug:'錯誤',idea:'建議',other:'其他'};
const fmtT=s=>new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
let sb=null,days=14,reports=[];

// single-series daily bars: one hue, 4px rounded tops on the baseline, 2px gaps, recessive grid, hover tooltip per bar
function bars(el,rows,key,unit){
  el.innerHTML='';if(!rows.length){el.innerHTML='<div class="empty">這段期間還沒有資料。</div>';return}
  const W=el.clientWidth||320,H=150,pad={l:28,r:4,t:8,b:20},max=Math.max(1,...rows.map(r=>r[key]));
  const step=Math.max(1,Math.ceil(max/3)),top=step*3,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,bw=Math.max(2,iw/rows.length-2);
  const y=v=>pad.t+ih-v/top*ih;
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2a3850" stroke-width="1"/><text x="${pad.l-6}" y="${y(v)+4}" fill="#8f9ab3" font-size="10" text-anchor="end">${v}</text>`;
  rows.forEach((r,i)=>{const x=pad.l+i*(iw/rows.length)+1,h=Math.max(0,ih-(y(r[key])-pad.t)),yy=y(r[key]);
    if(h>0){const rr=Math.min(4,bw/2,h);g+=`<path d="M${x} ${yy+h}V${yy+rr}q0-${rr} ${rr}-${rr}h${bw-2*rr}q${rr} 0 ${rr} ${rr}V${yy+h}z" fill="#b65cf0"/>`}
    g+=`<rect class="hit" data-i="${i}" x="${x-1}" y="${pad.t}" width="${bw+2}" height="${ih}" fill="transparent"/>`;
    if(i===0||i===rows.length-1||rows.length<=8)g+=`<text x="${x+bw/2}" y="${H-5}" fill="#8f9ab3" font-size="10" text-anchor="middle">${r.day.slice(5)}</text>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每日${unit}">${g}</svg><div class="tip" hidden></div>`;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('.hit').forEach(h=>{h.addEventListener('mouseenter',()=>{const r=rows[+h.dataset.i];tip.hidden=false;tip.textContent=`${r.day.slice(5)}　${r[key]} ${unit}`;tip.style.left=(+h.getAttribute('x')+(+h.getAttribute('width'))/2)/W*100+'%';tip.style.top=y(r[key])+'px'});h.addEventListener('mouseleave',()=>tip.hidden=true)});
}
function table(rows,cols){if(!rows.length)return '<div class="empty">這段期間還沒有資料。</div>';
  return `<table><tr>${cols.map(c=>`<th${c.n?' style="text-align:right"':''}>${c.h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td${c.n?' class="n"':''}>${c.f(r)}</td>`).join('')}</tr>`).join('')}</table>`}

function render(st){
  const d=st.daily||[],sum=k=>d.reduce((s,r)=>s+(+r[k]||0),0),today=d.length&&d[d.length-1].day===new Date().toLocaleDateString('sv',{timeZone:'Asia/Taipei'})?d[d.length-1]:null;
  const af=sum('ad_filled'),au=sum('ad_unfilled'),T=st.totals||{};
  const tile=(v,l,s)=>`<div class="tile"><span>${l}</span><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
  app.innerHTML=`
  <header><h1>秘法雙橋 後台<small>台北時間</small></h1><span class="sp"></span>
    <div class="seg" id="range">${[7,14,30].map(n=>`<button data-d="${n}" aria-pressed="${n===days}">${n} 天</button>`).join('')}</div>
    <a href="https://www.google.com/adsense/" target="_blank" rel="noopener">AdSense 收入</a><a href="./">回到遊戲</a></header>
  <div class="tiles">
    ${tile(today?today.devices:0,'今天的玩家','以裝置計')}
    ${tile(T.devices||0,'累計玩家','開過遊戲的裝置')}
    ${tile(T.users||0,'Google 登入帳號',`排行榜上 ${T.players||0} 人 · 公會 ${T.guilds||0}`)}
    ${tile(sum('battles'),`${days} 天對戰`,'勝率 '+pct(sum('wins'),sum('battles')))}
    ${tile(sum('pulls'),`${days} 天抽卡`,`開寶箱 ${sum('chests')} · 升級 ${sum('upgrades')}`)}
    ${tile(pct(af,af+au),'廣告填充率',`有廣告 ${af} / 請求 ${af+au}`)}
    ${tile(T.open_reports||0,'待處理回報','')}
  </div>
  <div class="grid">
    <div class="card"><h2>每日玩家<small>裝置數</small></h2><div class="chart" id="cDev"></div></div>
    <div class="card"><h2>每日對戰<small>場</small></h2><div class="chart" id="cBat"></div></div>
    <div class="card"><h2>每日抽卡<small>次</small></h2><div class="chart" id="cPull"></div></div>
  </div>
  <div class="grid">
    <div class="card"><h2>各模式</h2>${table(st.modes||[],[{h:'模式',f:r=>esc(MODE[r.mode]||r.mode)},{h:'場數',n:1,f:r=>r.battles},{h:'勝率',n:1,f:r=>pct(r.wins,r.battles)}])}</div>
    <div class="card"><h2>畫面瀏覽</h2>${table(Object.entries(st.screens||{}).sort((a,b)=>b[1]-a[1]),[{h:'畫面',f:r=>esc(SCREEN[r[0]]||r[0])},{h:'次數',n:1,f:r=>r[1]}])}</div>
    <div class="card"><h2>常見錯誤<small>${sum('errors')} 次</small></h2>${table(st.errors||[],[{h:'訊息',f:r=>`<span style="word-break:break-word">${esc(r.msg)}</span>`},{h:'次數',n:1,f:r=>r.n},{h:'最近',n:1,f:r=>fmtT(r.last)}])}</div>
  </div>
  <div class="card"><h2>問題回報<small>最近 100 則</small></h2><div id="reps"></div></div>`;
  bars($('#cDev'),d,'devices','台裝置');bars($('#cBat'),d,'battles','場');bars($('#cPull'),d,'pulls','次');
  $('#range').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;days=+b.dataset.d;load()});
  renderReports();
}
function renderReports(){
  const box=$('#reps');if(!box)return;
  if(!reports.length){box.innerHTML='<div class="empty">還沒有人回報問題。</div>';return}
  box.innerHTML=reports.map(r=>`<div class="rep${r.status==='done'?' done':''}"><div><span class="k ${esc(r.kind)}">${esc(KIND[r.kind]||r.kind)}</span><span class="muted">${fmtT(r.at)}${r.contact?' · '+esc(r.contact):''}</span><p>${esc(r.msg)}</p></div>
    <button data-id="${r.id}" data-s="${r.status==='done'?'open':'done'}">${r.status==='done'?'改回待處理':'標記已處理'}</button>
    <div class="meta">版本 ${esc(r.ctx&&r.ctx.ver)} · 畫面 ${esc(r.ctx&&r.ctx.view)} · Lv.${esc(r.ctx&&r.ctx.lv)} · ${r.uid?'已登入':'未登入'}${r.ctx&&r.ctx.errs&&r.ctx.errs.length?' · 最近錯誤：'+esc(r.ctx.errs.join(' / ')):''}<br>${esc(r.ctx&&r.ctx.ua)}</div></div>`).join('');
  box.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;
    const{error}=await sb.from('reports').update({status:b.dataset.s}).eq('id',+b.dataset.id);
    if(!error){const r=reports.find(x=>x.id===+b.dataset.id);r.status=b.dataset.s;renderReports()}else{b.disabled=false;alert('更新失敗：'+error.message)}}));
}
async function load(){
  const[{data:st,error},{data:reps}]=await Promise.all([sb.rpc('admin_stats',{days}),sb.from('reports').select('*').order('at',{ascending:false}).limit(100)]);
  if(error){app.innerHTML=`<div class="gate"><h2>沒有後台權限</h2><p class="muted">這個 Google 帳號不在管理員名單裡。</p><a href="./">回到遊戲</a></div>`;return}
  reports=reps||[];render(st);
}
async function boot(){
  const demo=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/[?&]demo=1/.test(location.search);
  if(demo)return demoBoot();
  sb=supabase.createClient(SB_URL,SB_KEY);
  const{data}=await sb.auth.getSession();
  if(!data.session){app.innerHTML=`<div class="gate"><h2>秘法雙橋 後台</h2><p class="muted">請先在遊戲裡用管理員的 Google 帳號登入（個人頁 → 帳號），再回到這一頁。</p><a href="./">前往遊戲登入</a></div>`;return}
  load();
}
// local preview with sample numbers: localhost/admin.html?demo=1
function demoBoot(){
  const d=[...Array(14)].map((_,i)=>{const t=new Date(Date.now()-(13-i)*864e5).toLocaleDateString('sv',{timeZone:'Asia/Taipei'}),b=8+Math.round(Math.sin(i/2)*5+i);return{day:t,devices:5+i*2,battles:b,wins:Math.round(b*.55),pulls:b*3,chests:b,upgrades:i,ad_filled:i*3,ad_unfilled:i,errors:i%3}});
  reports=[{id:1,at:new Date().toISOString(),kind:'bug',msg:'範例：第三章打完沒有掉寶箱',contact:'a@example.com',status:'open',uid:null,ctx:{ver:'demo',view:'battle',lv:3,errs:['TypeError: x is undefined'],ua:'Mozilla/5.0 (iPhone)'}},{id:2,at:new Date(Date.now()-36e5).toISOString(),kind:'idea',msg:'範例：希望有更多卡背',status:'done',uid:'u',ctx:{ver:'demo',view:'cards',lv:5,ua:'Mozilla/5.0 (Mac)'}}];
  sb={from:()=>({update:()=>({eq:async()=>({error:null})})})};
  render({daily:d,totals:{devices:120,users:14,players:12,guilds:2,open_reports:1},screens:{home:300,cards:120,gacha:90,profile:40,guild:20},modes:[{mode:'ladder',battles:80,wins:44},{mode:'story',battles:40,wins:30},{mode:'friend',battles:6,wins:3}],errors:[{msg:'TypeError: Cannot read properties of null',n:4,last:new Date().toISOString()}]});
}
boot();
</script>
</body></html>
